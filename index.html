<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Englisch-Quiz Klasse 8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Aufbau: ein Heftblatt pro Aufgabe, schmale Spalte fürs Handy, Fortschritt oben, Knöpfe unten */
:root{
  --bg:#eef1f6; --blatt:#ffffff; --linie:#d5dbe8; --text:#161b2c; --leise:#5a6278;
  --tinte:#2243c4; --tinte-hell:#e3e9fc; --rand:#d9534f;
  --gut:#1d7a46; --gut-hell:#e0f3e7; --falsch:#b8322d; --falsch-hell:#fbe6e4;
  --tipp:#7a5a00; --tipp-hell:#fff4cf;
  --kopf:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --lauf:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10131c; --blatt:#1a1f2e; --linie:#2e3550; --text:#eceffa; --leise:#a1a9c2;
  --tinte:#8ea6ff; --tinte-hell:#232c52; --rand:#e0706c;
  --gut:#6fd59a; --gut-hell:#173524; --falsch:#ff8f89; --falsch-hell:#3d1c1b;
  --tipp:#f0cf6a; --tipp-hell:#3a3113; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10131c; --blatt:#1a1f2e; --linie:#2e3550; --text:#eceffa; --leise:#a1a9c2;
  --tinte:#8ea6ff; --tinte-hell:#232c52; --rand:#e0706c;
  --gut:#6fd59a; --gut-hell:#173524; --falsch:#ff8f89; --falsch-hell:#3d1c1b;
  --tipp:#f0cf6a; --tipp-hell:#3a3113; color-scheme:dark }

*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--lauf);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--kopf);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
.klein{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leise);font-weight:600}
.leise{color:var(--leise)}

.blatt{background:var(--blatt);border:1px solid var(--linie);border-radius:4px;border-left:3px solid var(--rand);
  padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.schlicht{border-left:1px solid var(--linie)}

.balken{height:8px;background:var(--linie);border-radius:99px;overflow:hidden}
.balken i{display:block;height:100%;background:var(--tinte);border-radius:99px;transition:width .25s}
@media (prefers-reduced-motion: reduce){.balken i{transition:none}}
.kopfzeile{display:flex;justify-content:space-between;gap:12px;align-items:baseline}

.satz{font-family:var(--kopf);font-size:1.35rem;font-weight:500;line-height:1.35}
.luecke{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--tinte);margin:0 .15em;text-align:center;color:var(--tinte)}
.klammer{color:var(--leise);font-size:1rem;font-family:var(--lauf)}

.wahl{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--tinte);outline-offset:2px}
.opt{text-align:left;background:var(--blatt);border:2px solid var(--linie);border-radius:10px;padding:14px 16px;min-height:54px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--tinte);background:var(--tinte-hell)}
input.eingabe{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border:2px solid var(--linie);border-radius:10px;background:var(--blatt);color:var(--text)}
input.eingabe:focus{border-color:var(--tinte)}

.tippknopf{align-self:flex-start;background:none;border:none;padding:6px 0;color:var(--tipp);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tipp{background:var(--tipp-hell);border-radius:8px;padding:12px 14px;font-size:.97rem}
.tipp b{color:var(--tipp)}

.knoepfe{display:flex;gap:10px}
.haupt,.neben{border-radius:10px;padding:15px 18px;min-height:54px;font-weight:600;flex:1}
.haupt{background:var(--tinte);color:var(--blatt);border:2px solid var(--tinte)}
.neben{background:transparent;border:2px solid var(--linie);flex:0 0 auto}
.stapel{flex-direction:column}

.regel ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:8px}
.regel code,.erkl code{font-family:var(--kopf);font-weight:700;color:var(--tinte);font-size:1em}
.bsp{background:var(--tinte-hell);border-radius:8px;padding:10px 14px;font-family:var(--kopf)}

.note{font-family:var(--kopf);font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.teil{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-variant-numeric:tabular-nums}
.teil .balken{grid-column:1 / -1}
.erg{border-left-width:3px}
.erg.ok{border-left-color:var(--gut)} .erg.nein{border-left-color:var(--falsch)}
.marke{font-weight:700;font-size:.9rem;padding:3px 10px;border-radius:99px;align-self:flex-start}
.ok .marke{background:var(--gut-hell);color:var(--gut)} .nein .marke{background:var(--falsch-hell);color:var(--falsch)}
.paar{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.97rem}
.paar dt{color:var(--leise)} .paar dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.richtig{color:var(--gut)} .daneben{color:var(--falsch)}
.erkl{font-size:.97rem;border-top:1px solid var(--linie);padding-top:12px}
.oben{display:flex;justify-content:flex-end}
.vorne{background:var(--blatt);border:2px solid var(--linie);border-radius:99px;padding:9px 16px;min-height:44px;font-weight:600;font-size:.92rem}
.schleier{position:fixed;inset:0;z-index:20;background:rgba(10,13,22,.6);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.fenster{background:var(--blatt);color:var(--text);border:1px solid var(--linie);border-radius:14px;padding:22px 20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.fuss{display:flex;justify-content:center;padding-top:28px}
.punkt{width:44px;height:44px;background:none;border:none;padding:0;display:flex;align-items:center;justify-content:center}
.punkt::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--leise);opacity:.55}
.fenster.breit{max-width:520px;max-height:88vh;overflow-x:hidden;overflow-y:auto}
.liste{display:flex;flex-direction:column;gap:10px}
.eintrag{border:1px solid var(--linie);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.eintrag .zeile{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums}
.eintrag .wer{font-family:var(--kopf);font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.zahlen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zahlen div{background:var(--tinte-hell);border-radius:10px;padding:10px 12px}
.zahlen b{display:block;font-family:var(--kopf);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.offen{display:flex;flex-wrap:wrap;gap:8px}
.offen button{background:var(--falsch-hell);color:var(--falsch);border:none;border-radius:8px;padding:10px 14px;font-weight:600;min-width:48px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TEILE = {
  sp:{name:'Simple Present', wann:'Das nimmst du, wenn etwas immer wieder passiert. Zum Beispiel jeden Tag.',
    regel:[
      'Bei <code>he</code>, <code>she</code> und <code>it</code> kommt ein <code>s</code> ans Wort: I play → he play<b>s</b>.',
      'Merk dir: „He, she, it – das s muss mit!“',
      'Hört das Wort mit <code>ch</code>, <code>sh</code> oder <code>o</code> auf? Dann kommt <code>es</code> dran: watch → watch<b>es</b>, go → go<b>es</b>.',
      'Du willst „nicht“ sagen? Dann nimm <code>don’t</code>. Bei he, she, it nimm <code>doesn’t</code>.',
      'Du willst etwas fragen? Dann fang mit <code>Do</code> an. Bei he, she, it mit <code>Does</code>.',
      'Daran erkennst du es: always (immer), often (oft), never (nie), every day (jeden Tag).'
    ], bsp:'She plays tennis every Monday. = Sie spielt jeden Montag Tennis.'},
  pp:{name:'Present Progressive', wann:'Das nimmst du, wenn etwas genau jetzt passiert. In diesem Moment.',
    regel:[
      'Du brauchst immer zwei Teile: <code>am</code>, <code>is</code> oder <code>are</code> – und dann das Wort mit <code>ing</code> hinten.',
      'I <code>am</code> · he, she, it <code>is</code> · you, we, they <code>are</code>.',
      'Beispiel: He <b>is playing</b>. = Er spielt gerade.',
      'Hat das Wort hinten ein e? Das e fliegt raus: make → mak<b>ing</b>.',
      'Du willst „nicht“ sagen? Einfach <code>not</code> dazwischen: She is <b>not</b> sleeping.',
      'Daran erkennst du es: now (jetzt), at the moment (im Moment), Look! (Schau!), Listen! (Hör mal!).'
    ], bsp:'Look! He is playing football. = Schau! Er spielt gerade Fußball.'},
  pa:{name:'Simple Past', wann:'Das nimmst du, wenn etwas vorbei ist. Zum Beispiel gestern.',
    regel:[
      'Bei den meisten Wörtern hängst du einfach <code>ed</code> an: play → play<b>ed</b>.',
      'Manche Wörter machen das nicht. Sie werden ein ganz anderes Wort. Die musst du auswendig lernen: go → <b>went</b>, see → <b>saw</b>, buy → <b>bought</b>.',
      'Du willst „nicht“ sagen? Nimm <code>didn’t</code>. Danach bleibt das Wort ganz normal: I didn’t <b>go</b>.',
      'Du willst etwas fragen? Fang mit <code>Did</code> an. Danach bleibt das Wort auch ganz normal: Did you <b>see</b> him?',
      'Daran erkennst du es: yesterday (gestern), last week (letzte Woche), two days ago (vor zwei Tagen).'
    ], bsp:'Yesterday I went to school. = Gestern ging ich zur Schule.'},
  pap:{name:'Past Progressive', wann:'Das nimmst du, wenn du früher gerade mitten in etwas warst.',
    regel:[
      'Du brauchst zwei Teile: <code>was</code> oder <code>were</code> – und dann das Wort mit <code>ing</code>.',
      'I, he, she, it <code>was</code> · you, we, they <code>were</code>.',
      'Beispiel: I <b>was reading</b>. = Ich war gerade am Lesen.',
      'Oft passiert mittendrin plötzlich etwas Kurzes. Das Lange bekommt <code>was/were + ing</code>. Das Kurze bekommt Simple Past.',
      'Daran erkennst du es: while (während) und when (als).'
    ], bsp:'I was watching TV when the phone rang. = Ich schaute gerade fern, als das Handy klingelte.'},
  pf:{name:'Present Perfect', wann:'Das nimmst du, wenn etwas schon passiert ist – und es egal ist, wann genau.',
    regel:[
      'Du brauchst zwei Teile: <code>have</code> oder <code>has</code> – und dann die dritte Form vom Wort.',
      '<code>has</code> nimmst du nur bei he, she, it. Sonst immer <code>have</code>.',
      'Die dritte Form: Meistens einfach <code>ed</code> dran (tidy → tidied). Manche Wörter sind anders, die stehen in deiner Verbliste ganz rechts: go – went – <b>gone</b>.',
      'Daran erkennst du es: already (schon), just (gerade eben), ever (schon mal), never (noch nie).',
      '<code>since</code> und <code>for</code> heißen beide „seit“. since = seit wann? (since 2019). for = wie lange? (for three years).',
      'Achtung, Falle: Steht „yesterday“ oder „last week“ im Satz? Dann nimm Simple Past!'
    ], bsp:'I have already done my homework. = Ich habe meine Hausaufgaben schon gemacht.'},
  fu:{name:'Zukunft: will und going to', wann:'Das nimmst du für alles, was erst noch kommt. Es gibt zwei Arten.',
    regel:[
      '<code>will</code>: Du glaubst, dass etwas passiert. Oder du versprichst etwas. Oder dir fällt gerade erst ein, was du machst.',
      'Beispiel: I think it <b>will rain</b>. = Ich glaube, es wird regnen.',
      '„Nicht“ bei will heißt <code>won’t</code>.',
      '<code>going to</code>: Du hast es schon fest geplant. Davor steht <code>am</code>, <code>is</code> oder <code>are</code>.',
      'Beispiel: We <b>are going to visit</b> London. = Wir haben vor, London zu besuchen.'
    ], bsp:'Nur geglaubt → will. Fest geplant → going to.'},
  mi:{name:'Gemischt: Welche Zeit?', wann:'Jetzt musst du selbst raten, welche Zeit passt. Such im Satz das Wort, das es dir verrät.',
    regel:[
      'every day, usually, often → passiert immer wieder → <b>Simple Present</b>',
      'now, at the moment, Look! → passiert gerade jetzt → <b>Present Progressive</b>',
      'yesterday, last week, ago → ist vorbei → <b>Simple Past</b>',
      'while → war früher gerade dabei → <b>Past Progressive</b>',
      'already, just, ever, never, since, for → schon passiert → <b>Present Perfect</b>',
      'tomorrow, next week, I think → kommt erst noch → <b>will</b> oder <b>going to</b>'
    ], bsp:'Erst das Verrat-Wort suchen. Dann die Zeit wählen.'},
  vo:{name:'Verben und Vokabeln', wann:'Zum Schluss ein paar Wörter, die fast in jeder Prüfung drankommen.',
    regel:[
      'Manche Verben haben drei Formen. Zum Beispiel: go – went – gone.',
      'Die zweite Form (went) nimmst du bei „gestern“. Die dritte Form (gone) nimmst du nach have oder has.',
      'Pass auf bei Wörtern, die wie ein deutsches Wort klingen. Sie heißen oft etwas ganz anderes.',
      'Schreib die Wörter genau richtig. Jeder Buchstabe zählt.'
    ], bsp:'take – took – taken · eat – ate – eaten'}
};

const FRAGEN = [
 {id:1,s:'sp',q:'My brother ___ football every Saturday.',o:['play','played','plays','playing'],a:2,
  t:'„every Saturday“ heißt „jeden Samstag“. Das passiert also immer wieder. „My brother“ ist ein „he“. Was muss bei he ans Wort?',
  e:'Er spielt jeden Samstag, also immer wieder. „My brother“ ist ein „he“. Bei he kommt ein s dran: plays.'},
 {id:2,s:'sp',q:'She ___ TV every evening.',k:'watch',a:['watches'],
  t:'Bei „she“ muss hinten etwas ans Wort. „watch“ hört mit ch auf. Dann reicht ein s allein nicht – es kommen zwei Buchstaben dran.',
  e:'Bei she kommt ein s dran. Weil „watch“ mit ch aufhört, kommt „es“ dran: watches.'},
 {id:3,s:'sp',q:'Tom ___ like vegetables.',o:['don’t','doesn’t','isn’t','didn’t'],a:1,
  t:'Tom mag kein Gemüse. Tom ist ein „he“. Welches „nicht“-Wort gehört zu he?',
  e:'Tom ist ein „he“. Bei he, she, it heißt „nicht“: doesn’t. Bei allen anderen: don’t.'},
 {id:4,s:'sp',q:'___ your parents work on Sundays?',o:['Does','Are','Did','Do'],a:3,
  t:'Das ist eine Frage. „Your parents“ sind zwei Leute, also „they“. Mit welchem Wort fängt die Frage bei they an?',
  e:'Fragen fangen mit Do oder Does an. Does ist nur für he, she, it. Die Eltern sind „they“, also: Do.'},
 {id:5,s:'sp',q:'He doesn’t ___ in Munich.',o:['live','lives','lived','living'],a:0,
  t:'In „doesn’t“ steckt schon ein s drin. Braucht das nächste Wort dann noch ein s?',
  e:'Nach doesn’t bleibt das Wort ganz normal, ohne s. Das s steckt schon in doesn’t. Also: live.'},

 {id:6,s:'pp',q:'Look! The dog ___ in the garden.',o:['runs','is running','ran','run'],a:1,
  t:'„Look!“ heißt „Schau!“. Der Hund rennt also genau jetzt. Dafür brauchst du zwei Teile: is + Wort mit ing.',
  e:'„Look!“ – es passiert genau jetzt. Dann nimmst du is + ing: is running.'},
 {id:7,s:'pp',q:'Be quiet! The baby ___ .',k:'sleep',a:['is sleeping',"'s sleeping"],
  t:'Das Baby schläft genau jetzt. Schreib zwei Wörter: zuerst „is“, dann „sleep“ mit ing hinten.',
  e:'Es passiert genau jetzt. Also is + ing: is sleeping.'},
 {id:8,s:'pp',q:'They ___ a cake at the moment.',k:'make',a:['are making',"they're making","'re making"],
  t:'„at the moment“ heißt „im Moment“. Schreib zwei Wörter: bei „they“ kommt „are“, dann „make“ mit ing. Das e von make fliegt raus.',
  e:'„at the moment“ – es passiert jetzt. Bei they nimmst du are. Bei make fliegt das e raus: are making.'},
 {id:9,s:'pp',q:'I ___ TV right now. I’m doing my homework.',o:['don’t watch','not watching','am not watching','wasn’t watching'],a:2,
  t:'„right now“ heißt „genau jetzt“. Bei „I“ brauchst du „am“. Und weil er es NICHT macht, kommt „not“ dazu.',
  e:'Genau jetzt und „nicht“: am + not + ing. Also: am not watching.'},

 {id:10,s:'pa',q:'Yesterday we ___ to the cinema.',o:['go','goes','gone','went'],a:3,
  t:'„Yesterday“ heißt „gestern“. Das ist vorbei. „go“ ist ein Wort, das früher ganz anders heißt. Es fängt mit w an.',
  e:'„Yesterday“ ist vorbei. Aus „go“ wird dann „went“. Das muss man auswendig wissen.'},
 {id:11,s:'pa',q:'Last summer I ___ my grandparents.',k:'visit',a:['visited'],
  t:'„Last summer“ heißt „letzten Sommer“. Das ist vorbei. „visit“ ist ein ganz normales Wort. Häng einfach zwei Buchstaben hinten dran.',
  e:'Letzten Sommer ist vorbei. Bei normalen Wörtern hängst du ed dran: visited.'},
 {id:12,s:'pa',q:'Did you ___ the film?',o:['saw','seen','see','sees'],a:2,
  t:'Das „Did“ am Anfang zeigt schon: Es ist vorbei. Das Wort danach bleibt deshalb ganz normal.',
  e:'Nach Did bleibt das Wort ganz normal: see. Das Did sagt schon, dass es vorbei ist.'},
 {id:13,s:'pa',q:'He ___ a new phone two days ago.',k:'buy',a:['bought'],
  t:'„two days ago“ heißt „vor zwei Tagen“. Das ist vorbei. „buy“ wird früher ein ganz anderes Wort. Es fängt mit „bou“ an und hört mit „ght“ auf.',
  e:'Vor zwei Tagen ist vorbei. Aus „buy“ wird „bought“. Das muss man auswendig wissen.'},
 {id:14,s:'pa',q:'I ___ him yesterday.',k:'not / see',a:["didn't see",'did not see','didnt see'],
  t:'Gestern ist vorbei. Und du hast ihn NICHT gesehen. Schreib zwei Wörter: das „nicht“-Wort für früher, dann „see“ ganz normal.',
  e:'„Nicht“ für früher heißt didn’t. Danach bleibt das Wort ganz normal: didn’t see.'},

 {id:15,s:'pap',q:'At 8 o’clock last night I ___ my homework.',o:['do','was doing','am doing','have done'],a:1,
  t:'Gestern um 8 warst du gerade mittendrin. Dafür brauchst du was + Wort mit ing.',
  e:'Du warst gestern gerade dabei. Dann nimmst du was + ing: was doing.'},
 {id:16,s:'pap',q:'While we ___ football, it started to rain.',k:'play',a:['were playing'],
  t:'„While“ heißt „während“. Ihr wart gerade am Spielen. Schreib zwei Wörter: bei „we“ kommt „were“, dann „play“ mit ing.',
  e:'Ihr wart gerade am Spielen, da fing der Regen an. Bei we nimmst du were: were playing.'},
 {id:17,s:'pap',q:'She was cooking when the phone ___ .',o:['was ringing','rings','has rung','rang'],a:3,
  t:'Das Kochen dauert lang. Das Klingeln ist kurz und kommt plötzlich. Das Kurze bekommt die Form für „vorbei“ – ohne ing.',
  e:'Das Kurze, das plötzlich passiert, bekommt Simple Past. Aus „ring“ wird „rang“.'},

 {id:18,s:'pf',q:'I ___ already ___ my room.',o:['have … tidied','has … tidied','did … tidy','am … tidying'],a:0,
  t:'„already“ heißt „schon“. Das Zimmer ist schon aufgeräumt. Dafür nimmst du have oder has. Welches passt zu „I“?',
  e:'„already“ = schon passiert. Dann nimmst du have oder has. Bei „I“ ist es have: have tidied.'},
 {id:19,s:'pf',q:'She ___ to London three times.',k:'be',a:['has been',"she's been","'s been"],
  t:'Sie war schon dreimal dort. Wann, ist egal. Schreib zwei Wörter: bei „she“ kommt „has“, dann die dritte Form von „be“. Sie fängt mit „bee“ an.',
  e:'Sie war schon mal dort, wann ist egal. Bei she nimmst du has. Die dritte Form von be ist been: has been.'},
 {id:20,s:'pf',q:'Have you ever ___ sushi?',o:['eat','ate','eating','eaten'],a:3,
  t:'Nach „have“ kommt immer die dritte Form. Bei „eat“ heißen die drei Formen: eat – ate – und dann?',
  e:'Nach have kommt die dritte Form. eat – ate – eaten. Also: eaten.'},
 {id:21,s:'pf',q:'We have lived here ___ 2019.',o:['for','ago','since','in'],a:2,
  t:'Seit wann wohnen sie dort? Seit 2019. Welches Wort passt auf die Frage „seit wann“?',
  e:'„Seit wann?“ → since (since 2019). „Wie lange?“ → for (for five years).'},
 {id:22,s:'pf',q:'I ___ him yesterday.',o:['have seen','saw','has seen','see'],a:1,
  t:'Achtung, Falle! Im Satz steht „yesterday“ (gestern). Bei „gestern“ darfst du have nicht nehmen.',

 {id:23,s:'fu',q:'I think it ___ tomorrow.',o:['rained','rains','is raining','will rain'],a:3,

/* Speicherdienst: Adresse und öffentlicher Schlüssel. Sind beide leer, wird nichts gespeichert. */
const SPEICHERDIENST = { adresse:'https://zkwxrulbnkhqepzipnrm.supabase.co', schluessel:'sb_publishable_aQKaCGVp7-CRK6Y7JHwk5g_aSs3JfBw' };
const MIT_SPEICHERN = !!(SPEICHERDIENST.adresse && SPEICHERDIENST.schluessel);
let adminDaten = null;
function dienstKopf(mehr){ return Object.assign({'apikey':SPEICHERDIENST.schluessel,'Authorization':'Bearer '+SPEICHERDIENST.schluessel,'Content-Type':'application/json'}, mehr||{}); }
async function senden(){
  const teile={};
  Object.keys(TEILE).forEach(k=>{ const g=FRAGEN.filter(f=>f.s===k); teile[k]=[g.filter(stimmt).length, g.length]; });
  z.sende='laeuft'; zeigen();
  try{
    const r = await fetch(SPEICHERDIENST.adresse+'/rest/v1/ergebnisse', {method:'POST', headers:dienstKopf({'Prefer':'return=minimal'}),
      body:JSON.stringify({name:(z.name||'').trim().slice(0,30)||'Ohne Namen', richtig:FRAGEN.filter(stimmt).length, gesamt:FRAGEN.length, teile})});
    z.sende = r.ok ? 'ok' : 'fehler';
  }catch(e){ z.sende='fehler'; }
  zeigen();
}
async function auswertungHolen(code){
  z.admin='laedt'; zeigen();
  try{
    const r = await fetch(SPEICHERDIENST.adresse+'/rest/v1/rpc/auswertung', {method:'POST', headers:dienstKopf(), body:JSON.stringify({code})});
    if(r.ok){ adminDaten = await r.json(); z.admin='liste'; }
    else { z.admin = (r.status===400||r.status===401||r.status===403) ? 'falsch' : 'stoerung'; }
  }catch(e){ z.admin='stoerung'; }
  zeigen();
}

}

const NACH_ID =Object.fromEntries(FRAGEN.map(f=>[f.id,f]));
const SPEICHER = 'englischquiz-kl8-v2';
let z = {phase:'start', aktiv:FRAGEN.map(f=>f.id), pos:0, antw:{}, tippAuf:false};

function laden(){ try{ const s = JSON.parse(localStorage.getItem(SPEICHER)); if(s && s.aktiv && s.antw){ z = Object.assign(z, s, {tippAuf:false}); } }catch(e){} }
function sichern(){ try{ localStorage.setItem(SPEICHER, JSON.stringify({ok:z.ok===true,name:z.name||'',phase:z.phase,aktiv:z.aktiv,pos:z.pos,antw:z.antw})); }catch(e){} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();

function schritte(){
  const out=[]; let letzter=null;
  z.aktiv.forEach(id=>{ const f=NACH_ID[id]; if(f.s!==letzter){ out.push({regel:f.s}); letzter=f.s; } out.push({frage:f}); });
  out.push({abgabe:true});
  return out;
}
function beantwortet(f){ const a=z.antw[f.id]; return f.o ? typeof a==='number' : norm(a)!==''; }
function stimmt(f){ const a=z.antw[f.id]; return f.o ? a===f.a : f.a.map(norm).includes(norm(a)); }
function loesung(f){ return f.o ? f.o[f.a] : f.a[0].replace(/'/g,'’'); }
function satzHtml(f, fuell){
  let i=0; const teile = fuell ? String(fuell).split(' … ') : [];
  let h = esc(f.q).replace(/___/g, ()=>`<span class="luecke">${fuell ? esc(teile[i++]||teile[0]) : '&nbsp;'}</span>`);
  if(f.k) h += ` <span class="klammer">(${esc(f.k)})</span>`;
  return h;
}

function zeigen(){
  const app=document.getElementById('app');
  let h = z.ok!==true ? torHtml() : z.phase==='start' ? startHtml() : z.phase==='ergebnis' ? ergebnisHtml() : laufHtml();
  if(z.ok===true && z.phase!=='start') h =`<div class="oben"><button class="vorne" data-tun="neufrage">↺ Von vorne anfangen</button></div>` + h;
  if(z.fragtNeu) h += `<div class="schleier" data-tun="neunein">
    <div class="fenster" role="dialog" aria-modal="true" aria-labelledby="fenster-titel" data-tun="nichts">
      <h2 id="fenster-titel">Wirklich von vorne anfangen?</h2>
      <p>Alle deine Antworten werden gelöscht. Du landest wieder auf dem Startbildschirm.</p>
      <div class="knoepfe stapel">
        <button class="haupt" data-tun="neu">Ja, von vorne anfangen</button>
        <button class="neben" data-tun="neunein">Nein, weitermachen</button>
      </div>
    </div></div>`;
  if(MIT_SPEICHERN) h += `<div class="fuss"><button class="punkt" data-tun="punkt" aria-label="Auswertung öffnen"></button></div>`;
  if(z.admin) h += adminHtml();
  app.innerHTML = h;
  if(z.fragtNeu && document.querySelector){ const k=document.querySelector('.fenster .neben'); if(k) k.focus(); }
  if(z.admin && z.admin!=='liste' && z.admin!=='laedt'){ const c=document.getElementById('admincode'); if(c) c.focus(); }
  sichern();
}

function torHtml(){
  if(z.ok==='nein') return `
  <div class="blatt">
    <p class="klein">Kein Zutritt</p>
    <h1>Ohne Zustimmung geht es nicht weiter</h1>

  return `

  </div>` : ''}
  <div class="knoepfe"><button class="haupt" data-tun="los">Los geht’s</button></div>`;

function laufHtml(){
  const sch=schritte(); const st=sch[z.pos]; const n=z.aktiv.length;
  const erledigt=z.aktiv.filter(id=>beantwortet(NACH_ID[id])).length;
  let kopf=`<div class="kopfzeile"><span class="klein">${erledigt} von ${n} beantwortet</span></div>
    <div class="balken" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${erledigt}"><i style="width:${n?erledigt/n*100:0}%"></i></div>`;
  let mitte='';
  if(st.regel){
    const t=TEILE[st.regel];
    mitte=`<div class="blatt regel">
      <p class="klein">Kurz erklärt</p><h2>${t.name}</h2><p>${t.wann}</p>
      <ul>${t.regel.map(r=>`<li>${r}</li>`).join('')}</ul>
      <p class="bsp">${esc(t.bsp)}</p></div>`;
  } else if(st.frage){
    const f=st.frage; const nr=z.aktiv.indexOf(f.id)+1;
    let eingabe;
    if(f.o){
      eingabe=`<div class="wahl">${f.o.map((o,i)=>`<button class="opt" aria-pressed="${z.antw[f.id]===i}" data-tun="wahl" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    } else {
      eingabe=`<label class="klein" for="eingabe-${f.id}">Deine Antwort</label>
        <input class="eingabe" id="eingabe-${f.id}" type="text" value="${esc(z.antw[f.id]||'')}" placeholder="Hier schreiben" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="next">`;
    }
    mitte=`<div class="blatt">
      <p class="klein">Aufgabe ${nr} von ${n} · ${TEILE[f.s].name}</p>
      <p class="satz">${satzHtml(f)}</p>
      ${eingabe}
      <button class="tippknopf" data-tun="tipp" aria-expanded="${z.tippAuf}">${z.tippAuf?'Tipp ausblenden':'Tipp anzeigen'}</button>
      ${z.tippAuf?`<p class="tipp"><b>Tipp:</b> ${esc(f.t)}</p>`:''}
    </div>`;
  } else {
    const offen=z.aktiv.filter(id=>!beantwortet(NACH_ID[id]));
    mitte=`<div class="blatt">
      <p class="klein">Fast geschafft</p><h2>Bereit zum Abgeben?</h2>
      ${offen.length
        ? `<p>Diese Aufgaben sind noch leer. Tippe auf eine Nummer, um dorthin zu springen:</p>
           <div class="offen">${offen.map(id=>`<button data-tun="sprung" data-id="${id}">${z.aktiv.indexOf(id)+1}</button>`).join('')}</div>
           <p class="leise">Leere Aufgaben zählen als falsch.</p>`
        : `<p>Du hast alle ${n} Aufgaben beantwortet. Nach dem Abgeben siehst du die Lösungen und kannst nichts mehr ändern.</p>`}
    </div>`;
  }
  const letzte = st.abgabe;
  const knoepfe=`<div class="knoepfe">
    ${z.pos>0?'<button class="neben" data-tun="zurueck">Zurück</button>':''}
    ${letzte?'<button class="haupt" data-tun="abgeben">Abgeben und Lösungen sehen</button>'
            :`<button class="haupt" data-tun="weiter">${st.regel?'Verstanden, weiter':'Weiter'}</button>`}
  </div>`;
  return kopf+mitte+knoepfe;
}

function ergebnisHtml(){
  const fr=z.aktiv.map(id=>NACH_ID[id]); const n=fr.length;
  const ok=fr.filter(stimmt).length; const anteil=n?ok/n:0;
  const spruch = anteil===1 ? 'Alles richtig. Du bist bereit für morgen.'
    : anteil>=.85 ? 'Sehr stark. Schau dir die paar Fehler an, dann sitzt es.'
    : anteil>=.6 ? 'Gute Grundlage. Lies die Erklärungen und übe deine Fehler noch einmal.'
    : 'Kein Problem – genau dafür übst du. Lies die Erklärungen in Ruhe und übe die Fehler noch einmal.';
  const teile=Object.keys(TEILE).map(k=>{ const g=fr.filter(f=>f.s===k); if(!g.length) return ''; const r=g.filter(stimmt).length;
    return `<div class="teil"><span>${TEILE[k].name}</span><b>${r} / ${g.length}</b><div class="balken"><i style="width:${r/g.length*100}%"></i></div></div>`; }).join('');
  const liste=fr.map((f,i)=>{ const r=stimmt(f); const a=z.antw[f.id];
    const mein = !beantwortet(f) ? '– leer –' : (f.o ? f.o[a] : a);
    return `<div class="blatt erg ${r?'ok':'nein'}">
      <span class="marke">${r?'Richtig':'Falsch'} · Aufgabe ${i+1}</span>
      <p class="satz">${satzHtml(f, loesung(f))}</p>
      <dl class="paar">
        ${r?'':`<dt>Deine Antwort</dt><dd class="daneben">${esc(mein)}</dd>`}
        <dt>Richtig ist</dt><dd class="richtig">${esc(loesung(f))}</dd>
      </dl>
      <p class="erkl"><b>Warum?</b> ${esc(f.e)}</p>
    </div>`; }).join('');
  const fehler=n-ok;
  return `
  <div class="blatt">
    <p class="klein">Dein Ergebnis</p>
    <p class="note">${ok} <span class="leise" style="font-size:1.4rem">von ${n}</span></p>
    <p>${spruch}</p>
    ${z.sende==='laeuft'?'<p class="leise">Dein Ergebnis wird gespeichert …</p>':''}
    ${z.sende==='ok'?'<p class="richtig">Dein Ergebnis wurde gespeichert.</p>':''}
    ${z.sende==='fehler'?'<p class="daneben">Das Speichern hat nicht geklappt. <button class="tippknopf" data-tun="senden">Noch einmal versuchen</button></p>':''}
    ${teile}
  </div>
  <div class="knoepfe stapel">
    ${fehler?`<button class="haupt" data-tun="fehler">Meine ${fehler} Fehler noch einmal üben</button>`:''}
    <button class="${fehler?'neben':'haupt'}" data-tun="neu">Ganz von vorne anfangen</button>
  </div>
  <h2>Alle Lösungen mit Erklärung</h2>
  ${liste}
  <div class="knoepfe stapel">
    ${fehler?`<button class="haupt" data-tun="fehler">Meine ${fehler} Fehler noch einmal üben</button>`:''}
    <button class="${fehler?'neben':'haupt'}" data-tun="neu">Ganz von vorne anfangen</button>
  </div>`;
}

function nachOben(){ try{ window.scrollTo(0,0); }catch(e){} }
function gehe(p){ z.pos=p; z.tippAuf=false; zeigen(); nachOben(); }

document.addEventListener('click', ev=>{
  const b=ev.target.closest('[data-tun]'); if(!b) return;
  const tun=b.dataset.tun; const st=schritte()[z.pos];
  if(tun==='los'){
    if(MIT_SPEICHERN && !(z.name||'').trim()){ z.nameFehlt=true; zeigen(); const n=document.getElementById('spitzname'); if(n) n.focus(); return; }
    z.nameFehlt=false; z.phase='lauf'; gehe(0); }
  else if(tun==='punkt'){ z.admin='code'; zeigen(); }
  else if(tun==='adminzu'){ z.admin=null; adminDaten=null; zeigen(); }
  else if(tun==='adminok'){ const c=document.getElementById('admincode'); const w=c?c.value.trim():''; if(w) auswertungHolen(w); }
  else if(tun==='senden'){ senden(); }
  else if(tun==='wahl'){ z.antw[st.frage.id]=Number(b.dataset.i); zeigen(); }
  else if(tun==='tipp'){ z.tippAuf=!z.tippAuf; zeigen(); }
  else if(tun==='weiter'){ gehe(z.pos+1); }
  else if(tun==='zurueck'){ gehe(z.pos-1); }
  else if(tun==='sprung'){ const id=Number(b.dataset.id); gehe(schritte().findIndex(s=>s.frage&&s.frage.id===id)); }
  else if(tun==='abgeben'){ const ganz = z.aktiv.length===FRAGEN.length; z.phase='ergebnis'; z.sende=null; zeigen(); nachOben(); if(MIT_SPEICHERN && ganz) senden(); }
  else if(tun==='fehler'){ const f=z.aktiv.filter(id=>!stimmt(NACH_ID[id])); f.forEach(id=>delete z.antw[id]); z.aktiv=f; z.phase='lauf'; gehe(0); }
  else if(tun==='neu'){ z.aktiv=FRAGEN.map(f=>f.id); z.antw={}; z.phase='start'; z.fragtNeu=false; z.sende=null; gehe(0); }
  else if(tun==='torja'){ z.ok=true; zeigen(); nachOben(); }
  else if(tun==='tornein'){ z.ok='nein'; zeigen(); nachOben(); }
  else if(tun==='torzurueck'){ z.ok=false; zeigen(); nachOben(); }
  else if(tun==='neufrage'){ z.fragtNeu=true; zeigen(); }
  else if(tun==='neunein'){ z.fragtNeu=false; zeigen(); }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && (z.fragtNeu||z.admin)){ z.fragtNeu=false; z.admin=null; adminDaten=null; zeigen(); } });
document.addEventListener('input', ev=>{
  if(ev.target.id==='spitzname'){ z.name=ev.target.value.slice(0,30); sichern(); return; }
  if(ev.target.id==='admincode') return;
  if(!ev.target.classList.contains('eingabe')) return;
  const st=schritte()[z.pos]; if(st.frage){ z.antw[st.frage.id]=ev.target.value; sichern(); }
});
document.addEventListener('keydown', ev=>{
  if(ev.key!=='Enter') return;
  if(ev.target.id==='spitzname'){ ev.preventDefault(); const b=document.querySelector('[data-tun="los"]'); if(b) b.click(); }
  else if(ev.target.id==='admincode'){ ev.preventDefault(); const b=document.querySelector('[data-tun="adminok"]'); if(b) b.click(); }
  else if(ev.target.classList.contains('eingabe')){ ev.preventDefault(); gehe(z.pos+1); }
});

laden();
if(z.pos>=schritte().length) z.pos=0;
zeigen();
</script>
